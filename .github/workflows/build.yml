name: Build and release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.version.outputs.tag }}
      already_published: ${{ steps.version.outputs.already_published }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Allocate automatic release version
        id: version
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: node scripts/release-version.mjs --apply
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements-build.txt
      - name: Validate source and version
        run: npm run check
        env:
          PYTHON: .venv/bin/python
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
      - name: Check configuration lifecycle
        run: .venv/bin/python checks/install-smoke.py
      - name: Check terminal exit lifecycle
        run: node checks/exit-smoke.cjs
      - name: Check completion notifications
        run: .venv/bin/python checks/completion-smoke.py
      - run: npm run package
      - run: .venv/bin/python scripts/bundle.py
      - name: Inspect release payload
        run: .venv/bin/python checks/package-smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: |
            dist/*.vsix
            dist/*-agent.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.already_published != 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --target "$SOURCE_SHA" --draft --generate-notes --title "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" dist/*.vsix dist/*-agent.tar.gz dist/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --latest
